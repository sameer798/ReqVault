<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReqShift - DevRequirement Tracker</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- html2pdf.js for High Contrast PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="brand">
                <i class="fa-solid fa-code-branch brand-icon"></i>
                <div>
                    <h1>ReqShift</h1>
                    <p class="subtitle">Manage project requirements & clean old tasks</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="add-row-btn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add New Row
                </button>
                <button id="export-clear-btn" class="btn btn-secondary">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF & Clear
                </button>
                <button id="check-old-btn" class="btn btn-danger">
                    <i class="fa-solid fa-broom"></i> Clear Old Data (1 Wk+)
                </button>
            </div>
        </header>

        <!-- Requirements Table Wrapper -->
        <div id="pdf-content" class="table-container">
            <table id="requirements-table">
                <thead>
                    <tr>
                        <th style="width: 90px;">ID</th>
                        <th style="width: 270px;">PAGE / TYPE</th>
                        <th>REQUIREMENT NOTES / CODE SNIPPET</th>
                        <th style="width: 200px;">STATUS</th>
                        <th style="width: 70px;" class="no-print">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamic Rows / Empty State render via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 7-Day Data Confirmation Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <i class="fa-solid fa-triangle-exclamation warning-icon"></i>
                <h3>Old Data Cleanup Warning</h3>
            </div>
            <p class="modal-body">
                Requirements older than 7 days were detected in local storage. Would you like to export them to PDF before clearing?
            </p>
            <div class="modal-actions">
                <button id="modal-export-clear-btn" class="btn btn-primary">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF & Clear
                </button>
                <button id="modal-just-clear-btn" class="btn btn-danger">
                    <i class="fa-solid fa-trash-can"></i> Just Clear
                </button>
                <button id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>
</html>
